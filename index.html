<!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map and Form</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .map-fix{
            width: 100%;
            height: 50vh;
        }
        iframe{
            width: 100% !important;
            height: 100%;
        }
        .contact-section{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            height: 365px;
            color: white;
        }
        h5{
            color: gray;
            text-align: center;
            font-size: 15px;
            margin-top: 5px;
        }
        h1{
            text-align: center;
            margin-top: 15px;
        }
        .contact-form {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  
  .form-row {
    display: flex;
    gap: 20px;
  }
  
  .form-row input{
    margin-top: 20px;
    flex: 1;
    padding: 10px 30px;
    background: transparent;
    border: 1px solid #555;
    color: white;
    font-size: 16px;
  }
  .text-area{
    padding: 30px;
    margin-top: 10px;
  }
  button{
    color: whitesmoke;
    background-color: red;
    width: 150px;
    padding: 5px;
    font-size: 10px;
    border-radius: 20px;
    margin-top: 10px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    border: none;
    margin-bottom: 5px;
  }
  @media (max-width:420px){
    .map-fix{
        width: 100%;
    }
    .contact-section{
        width: 100%;
        height: 80vh;
    }
    .form-row{
        flex-direction: column;
    }
  }
    </style>
 </head>
 <body>
    <div class="formcontent">
        <div class="map-fix">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3889.905641730466!2d80.22325137483915!3d12.84937068745485!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a52678b6ec7b719%3A0xc0cf6f565e5669c7!2sSLA%20Institute!5e0!3m2!1sen!2sin!4v1745644731827!5m2!1sen!2sin" width="600" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <section class="contact-section">
            <div class="contact-container">
              <h5>START YOUR NEW PROJECT</h5>
              <h1>Fill out the form & we'll be <br>in touch soon!</h1>
              <form class="contact-form">
                <div class="form-row">
                  <input class="form-colum" type="text" placeholder="Name *" required>
                  <input type="tel" placeholder="Phone">
                </div>
                <div class="form-row">
                    <input type="text" placeholder="email*" required>
                    <input type="tel" placeholder="budget">
                  </div>
                <textarea class="text-area" placeholder="Describe your project"></textarea>
                <button type="submit" class="send-button">Send Message</button>
              </form>
            </div>
          </section>
    </div>
 </body>
 </html>
